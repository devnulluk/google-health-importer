<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Google Health Importer</title><desc id="desc">A data pulse flowing into a heart-shaped personal data store.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1536"/><stop offset="1" stop-color="#173e8f"/></linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7db5ff"/><stop offset="1" stop-color="#5ce1a5"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/><circle cx="1005" cy="25" r="170" fill="#4386ff" opacity=".10"/><circle cx="1100" cy="350" r="230" fill="#39d98a" opacity=".08"/>
  <g transform="translate(80 82)" fill="none" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M10 92h78l22-48 34 112 32-76 25 42h78"/><path d="M310 95c0-45 62-59 82-17 20-42 82-28 82 17 0 50-82 102-82 102S310 145 310 95z"/>
  </g>
  <g fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif"><text x="610" y="142" font-size="52" font-weight="750">Google Health Importer</text><text x="612" y="194" font-size="25" fill="#cbd9f8">Own your history. Keep your choices.</text><text x="612" y="247" font-size="19" fill="#85efbd">Google Health  →  Open Wearables  →  Your data</text></g>
</svg>
